<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자기주도학습 통합 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
/* Layout: 넓은 PC 기준 업무 도구 — 상단 고정 헤더 + 탭, 본문 최대 1680px, 표 중심. 칠판 녹색을 기준색으로, 학년색(노랑·초록·파랑)은 기존 앱 규칙 유지 */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --surface-2:#eaeee8; --line:#d3dbd2; --line-2:#e3e8e1;
  --ink:#18221c; --ink-2:#56635b; --ink-3:#86928a;
  --accent:#1e6a50; --accent-ink:#ffffff; --accent-soft:#dcebe3;
  --good:#24723a; --good-soft:#dff0e3; --warn:#9a5208; --warn-soft:#fbeed8; --bad:#ad2a2a; --bad-soft:#f9e2df;
  --g1:#d08700; --g1-soft:#fbefd2; --g2:#1c8556; --g2-soft:#d9efe3; --g3:#2d5fc0; --g3-soft:#dfe7f8;
  --l1:#7c4a96; --l2:#0d7680; --l3:#46529f;
  --hol:#fbe7e4; --we:#f6f1e3;
  --f-sans:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201b; --surface-2:#212a24; --line:#2e3a32; --line-2:#26302a;
  --ink:#e3eae5; --ink-2:#a1aea6; --ink-3:#71807a;
  --accent:#5cbf96; --accent-ink:#0b1811; --accent-soft:#1b3328;
  --good:#6cc584; --good-soft:#1b3122; --warn:#e7a54f; --warn-soft:#3a2a12; --bad:#ef7f72; --bad-soft:#3d1d1a;
  --g1:#f0b43c; --g1-soft:#3a2d10; --g2:#4fc58c; --g2-soft:#173326; --g3:#7fa4f0; --g3-soft:#1c2843;
  --l1:#c08ad8; --l2:#4fc0c9; --l3:#9aa6ee;
  --hol:#36201d; --we:#2c2817; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201b; --surface-2:#212a24; --line:#2e3a32; --line-2:#26302a;
  --ink:#e3eae5; --ink-2:#a1aea6; --ink-3:#71807a;
  --accent:#5cbf96; --accent-ink:#0b1811; --accent-soft:#1b3328;
  --good:#6cc584; --good-soft:#1b3122; --warn:#e7a54f; --warn-soft:#3a2a12; --bad:#ef7f72; --bad-soft:#3d1d1a;
  --g1:#f0b43c; --g1-soft:#3a2d10; --g2:#4fc58c; --g2-soft:#173326; --g3:#7fa4f0; --g3-soft:#1c2843;
  --l1:#c08ad8; --l2:#4fc0c9; --l3:#9aa6ee;
  --hol:#36201d; --we:#2c2817; color-scheme:dark; }

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.brand h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;font-size:12.5px;color:var(--ink-2)}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync.ok::before{background:var(--good)} .sync.busy::before{background:var(--warn)} .sync.err::before{background:var(--bad)}
.mode{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.mode.admin{background:var(--good-soft);color:var(--good)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 16px 11px;font-weight:600;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}

main{padding-block:20px 60px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:18px}
.g-home{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.35fr)}
.g-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-dutyset{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)}
@media (max-width:1100px){.g-home{grid-template-columns:1fr 1fr}.g-home>:first-child{grid-column:1/-1}}
@media (max-width:760px){.g-home,.g-2,.g-dutyset{grid-template-columns:1fr}.g-home>:first-child{grid-column:auto}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel.flat{background:transparent;border:0;padding:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h2{font-size:16px;font-weight:700}
.ph h3{font-size:14.5px;font-weight:700}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3)}
.muted{color:var(--ink-2)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:7px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--ink-2);cursor:not-allowed}
textarea{resize:vertical}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;white-space:nowrap;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.chk input{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 13px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* tags */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}
.t-ok{background:var(--good-soft);color:var(--good)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-mute{background:var(--surface-2);color:var(--ink-2)}
.loc{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.loc::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.loc.DORM{color:var(--l1)} .loc.STUDY_12{color:var(--l2)} .loc.STUDY_3{color:var(--l3)}
.gr{font-weight:600}.gr.g1{color:var(--g1)}.gr.g2{color:var(--g2)}.gr.g3{color:var(--g3)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tw.tall{max-height:640px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line-2);text-align:center;vertical-align:middle}
thead th{background:var(--surface-2);font-weight:600;font-size:12.5px;color:var(--ink-2);position:sticky;top:0;z-index:1;white-space:nowrap}
thead tr+tr th{top:33px}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
td.l,th.l{text-align:left}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hol td{background:var(--hol)} tr.we td{background:var(--we)}
tr.today td{box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
tr.month-start td{border-top:2px solid var(--line)}
tfoot td{background:var(--surface-2);font-weight:700}
.cell-x{color:var(--ink-3)}
.cell-none{color:var(--bad);font-weight:600}
.cell-input{width:64px;text-align:center;padding:4px;font-family:var(--f-mono)}
.cell-input.warn{border-color:var(--warn);background:var(--warn-soft)}
.manual{font-size:10.5px;color:var(--warn);font-weight:700;margin-left:3px}
td select{padding:3px 5px;font-size:13px;min-width:92px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface-2);border-radius:7px;padding:12px}
.kpi b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink-2)}
.duty-today{display:flex;flex-direction:column;gap:8px}
.duty-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:7px}
.duty-line strong{font-size:17px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.5fr) minmax(0,.5fr);border-top:1px solid var(--line);border-left:1px solid var(--line);min-width:980px}
.cal .hd{padding:7px;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .hd.sat{color:var(--g3)} .cal .hd.sun{color:var(--bad)}
.day{min-height:132px;padding:7px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:left;border-top:0;border-left:0;font:inherit;color:inherit}
.day:hover{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.day.other{background:var(--surface-2);opacity:.55}
.day.we{background:var(--we)}
.day.hol{background:var(--hol)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day .dn{font-family:var(--f-mono);font-weight:600;font-size:13px}
.day.sun .dn{color:var(--bad)} .day.sat .dn{color:var(--g3)}
.day .hr{font-size:11.5px;font-weight:600;color:var(--bad)}
.day .dl{display:flex;gap:5px;font-size:12px;align-items:baseline;min-width:0}
.day .dl i{font-style:normal;font-size:10.5px;font-weight:700;width:46px;flex:none}
.day .dl i.DORM{color:var(--l1)} .day .dl i.STUDY_12{color:var(--l2)} .day .dl i.STUDY_3{color:var(--l3)}
.day .dl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .dl .ex{color:var(--bad);font-weight:600;font-size:11.5px}
.day.phol{background:linear-gradient(180deg,var(--hol) 0,var(--hol) 26px,var(--surface) 26px)}
.day.focus{box-shadow:inset 0 0 0 3px var(--warn)}
@media (prefers-reduced-motion:no-preference){.day.focus{animation:pulse 1.2s ease-out 2}@keyframes pulse{50%{background:var(--warn-soft)}}}
.mine-row{cursor:pointer}
.mine-row.past td{color:var(--ink-3)}
.chart .b1{fill:color-mix(in srgb,var(--g1) 30%,var(--surface))} .chart .b2{fill:color-mix(in srgb,var(--g2) 30%,var(--surface))} .chart .b3{fill:color-mix(in srgb,var(--g3) 30%,var(--surface))}
.chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round}
.chart .ln1{stroke:var(--g1)} .chart .ln2{stroke:var(--g2)} .chart .ln3{stroke:var(--g3)}
.chart .pt1{fill:var(--g1)} .chart .pt2{fill:var(--g2)} .chart .pt3{fill:var(--g3)}
.chart .pt{stroke:var(--surface);stroke-width:2}
.chart .vl{font-size:11px;font-weight:600;fill:var(--ink)}
.rep-tables{display:flex;flex-direction:column;gap:12px;overflow-x:auto}
.rep-tables table{font-size:13px}
.rep-tables th,.rep-tables td{border:1px solid var(--line-2);padding:6px 8px}
.rep-tables caption{caption-side:top;text-align:left;font-weight:700;font-size:13px;padding:0 0 6px}
.day .st{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.pill{font-family:var(--f-mono);font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:4px}
.pill.g1{background:var(--g1-soft);color:var(--g1)} .pill.g2{background:var(--g2-soft);color:var(--g2)} .pill.g3{background:var(--g3-soft);color:var(--g3)}
.pill.rs{background:var(--bad-soft);color:var(--bad);font-family:var(--f-sans)}

/* bars */
.bar{position:relative;height:8px;background:var(--surface-2);border-radius:4px;min-width:90px}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-2)}
.chart text{fill:var(--ink-2);font-size:12px;font-family:var(--f-sans)}
.chart .grid line{stroke:var(--line-2)}
.chart .a1{fill:var(--g1-soft)} .chart .t1{fill:var(--g1)}
.chart .a2{fill:var(--g2-soft)} .chart .t2{fill:var(--g2)}
.chart .a3{fill:var(--g3-soft)} .chart .t3{fill:var(--g3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

.note{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:7px;padding:12px 14px;font-size:13.5px}
.note.ok{border-left-color:var(--good);background:var(--good-soft)}
.note.info{border-left-color:var(--accent);background:var(--accent-soft)}
.note p{margin:3px 0}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.empty{padding:36px 18px;text-align:center;color:var(--ink-2)}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:6px}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap}
.datelist{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);text-align:left;line-height:1.6;max-width:420px}
.report-text{white-space:pre-wrap;font-size:13px;background:var(--surface-2);border-radius:7px;padding:12px 14px;margin:0;font-family:var(--f-sans);line-height:1.65;max-height:320px;overflow:auto}
.form-line{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.form-line .field{flex:1 1 140px}
.t-add{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(100px,.8fr) minmax(140px,1fr) minmax(120px,1fr) auto auto minmax(250px,1.5fr) auto;gap:10px;align-items:end}
.t-add .field>span{white-space:nowrap}
.t-add input,.t-add select,.t-add .btn,.t-add .chk{height:38px;box-sizing:border-box}
.t-add .chk{padding-block:0}
.t-add .days{display:flex;gap:4px}
.t-add .range{display:flex;align-items:center;gap:4px}
.t-add .range input{flex:1}
@media (max-width:1500px){.t-add{grid-template-columns:repeat(4,minmax(0,1fr))}.t-add>:nth-child(6),.t-add>:nth-child(7){grid-column:span 2}}
@media (max-width:760px){.t-add{grid-template-columns:1fr 1fr}.t-add>:nth-child(6),.t-add>:nth-child(7){grid-column:1/-1}}
.box{border:1px solid var(--line);border-radius:7px;padding:12px;display:flex;flex-direction:column;gap:10px}
.box h4{font-size:13.5px}

/* modal / toast */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(560px,100%);max-height:calc(100% - 40px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.modal.wide{width:min(860px,100%)}
.modal h3{font-size:17px}
.mf{display:flex;justify-content:flex-end;gap:8px}
.g-grade{display:grid;grid-template-columns:110px repeat(2,minmax(0,1fr));gap:8px;align-items:center}
.g-grade>b{font-size:13px}
#toastRoot{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13.5px;max-width:380px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.toast.err{background:var(--bad);color:var(--surface)}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out}@keyframes tin{from{transform:translateY(6px);opacity:0}}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <div class="mark" aria-hidden="true">自</div>
      <div><h1>자기주도학습 통합 관리</h1><p id="termLabel">감독 배정 · 공정성 검증 · 참여 현황 보고</p></div>
    </div>
    <div class="top-actions">
      <span id="syncBadge" class="sync">불러오는 중</span>
      <span id="modeBadge" class="mode">열람 전용</span>
      <button id="authBtn" class="btn" type="button">코드로 로그인</button>
    </div>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="메뉴">
    <button type="button" data-tab="home">근무 확인</button>
    <button type="button" data-tab="calendar">통합 달력</button>
    <button type="button" data-tab="report">참여 현황 보고</button>
    <button type="button" data-tab="duty">감독 배정</button>
    <button type="button" data-tab="fairness">공정성 검증</button>
  </nav>
</header>

<script>
/*CORE-START*/
const LOCS = ['DORM','STUDY_12','STUDY_3'];
const LOC_NAME = {ALL:'전체', DORM:'기숙사', STUDY_12:'여학생정독실·1,2자습실', STUDY_3:'3학년 자습실'};
const LOC_SHORT = {DORM:'기숙사', STUDY_12:'1·2자습실', STUDY_3:'3학년실'};
const DOW = ['일','월','화','수','목','금','토'];
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addD = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return fd(d); };
const dowOf = s => pd(s).getDay();
const mondayOf = s => { const d = pd(s); const w = d.getDay(); d.setDate(d.getDate() - (w === 0 ? 6 : w - 1)); return fd(d); };
const md = s => { const d = pd(s); return `${d.getMonth()+1}.${d.getDate()}`; };
const isName = v => !!v && v !== 'X' && v !== '!';

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function holidaysOn(duty, ds){ return duty.holidays.filter(h => h.date === ds); }
function isLocHoliday(duty, ds, loc){ return duty.holidays.some(h => h.date === ds && (h.locs.includes('ALL') || h.locs.includes(loc))); }
function holidayNote(duty, ds){
  return holidaysOn(duty, ds).map(h => (h.locs.includes('ALL') ? '' : `[${h.locs.map(l => LOC_SHORT[l] || l).join(',')}] `) + h.reason).join(', ');
}
function sigOf(duty){
  const s = JSON.stringify({st:{...duty.settings, pin:undefined}, h:duty.holidays.map(h=>[h.date,h.locs]), t:duty.teachers.map(t=>[t.name,t.loc,t.exclude,t.offDays,t.prevEnd,t.leaveStart,t.leaveEnd])});
  let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h >>> 0);
}

/* 배정 원칙: 장소별 명단 → 불가 요일·기간 제외 → (금요일이면 금요일 횟수 적은 순) → 누적 횟수 적은 순 → 마지막 근무가 오래된 순 → 시드 고정 무작위 */
function generateSchedule(duty, target, seed, keepPins){
  const rng = mulberry32(seed);
  const st = duty.settings;
  const pools = {};
  LOCS.forEach(l => pools[l] = duty.teachers.filter(t => !t.exclude && t.loc === l).map(t => ({t, count:0, fri:0, last: t.prevEnd ? -5 : -99})));
  const prev = {}; (duty.schedule || []).forEach(r => prev[r.date] = r);
  /* 직접 지정(고정) 칸: keepPins면 그대로 두고, 그 횟수를 미리 셈에 넣어 나머지 칸으로 균형을 맞춘다 */
  const pins = {};
  if (keepPins) (duty.schedule || []).forEach(r => LOCS.forEach(l => {
    if (r.wk || !(r.m && r.m[l]) || !isName(r.c[l]) || (target !== 'ALL' && target !== l)) return;
    if (r.date < st.start || r.date > st.end || isLocHoliday(duty, r.date, l) || r.date > (st.ends[l] || st.end)) return;
    const pp = pools[l].find(x => x.t.name === r.c[l]); if (!pp) return;
    (pins[r.date] = pins[r.date] || {})[l] = pp; pp.count++; if (r.w === 5) pp.fri++;
  }));
  const out = []; let idx = 0;
  const pick = (pool, fri, dw, ds) => {
    const av = pool.filter(p => !(p.t.offDays || []).includes(dw) && !(p.t.leaveStart && p.t.leaveEnd && ds >= p.t.leaveStart && ds <= p.t.leaveEnd));
    if (!av.length) return '!';
    av.forEach(p => p.r = rng());
    av.sort((a, b) => (fri ? a.fri - b.fri : 0) || (a.count - b.count) || (a.last - b.last) || (a.r - b.r));
    const s = av[0]; s.count++; if (fri) s.fri++; s.last = idx; return s.t.name;
  };
  for (let ds = st.start; ds <= st.end; ds = addD(ds, 1)){
    const w = dowOf(ds), wk = (w === 0 || w === 6);
    const sps = duty.specials.filter(s => s.date === ds);
    if (wk && !sps.length) continue;
    const p = prev[ds] || {};
    const row = {date:ds, w, wk, c:{}, sp:{}, m:{}, note: holidayNote(duty, ds)};
    LOCS.forEach(l => {
      const sp = sps.find(s => s.loc === l);
      if (sp){ row.c[l] = sp.assigned || ''; row.sp[l] = true; if (sp.note && !row.note) row.note = sp.note; return; }
      if (wk){ row.c[l] = 'X'; return; }
      if (target !== 'ALL' && target !== l){ row.c[l] = (p.c && p.c[l] !== undefined) ? p.c[l] : 'X'; if (p.m && p.m[l]) row.m[l] = true; return; }
      const pin = pins[ds] && pins[ds][l];
      if (pin){ row.c[l] = pin.t.name; row.m[l] = true; pin.last = idx; return; }
      const end = st.ends[l] || st.end;
      row.c[l] = (isLocHoliday(duty, ds, l) || ds > end) ? 'X' : pick(pools[l], w === 5, DOW[w], ds);
    });
    out.push(row);
    if (!wk) idx++;
  }
  return out;
}

function computeStats(duty){
  const key = (l, n) => l + '|' + n;
  const per = {};
  duty.teachers.forEach(t => per[key(t.loc, t.name)] = {wd:0, fri:0, we:0, manual:0, dates:[]});
  const need = {}, none = {}, friNeed = {}; LOCS.forEach(l => { need[l] = 0; none[l] = 0; friNeed[l] = 0; });
  (duty.schedule || []).forEach(r => LOCS.forEach(l => {
    const v = r.c[l], sp = r.sp && r.sp[l];
    if (!sp && !r.wk && v !== 'X'){ need[l]++; if (r.w === 5) friNeed[l]++; }
    if (v === '!'){ none[l]++; return; }
    if (!isName(v)) return;
    const p = per[key(l, v)]; if (!p) return;
    if (sp || r.wk) p.we++; else { p.wd++; if (r.w === 5) p.fri++; }
    if (r.m && r.m[l]) p.manual++;
    p.dates.push(r.date);
  }));
  const locs = {};
  LOCS.forEach(l => {
    const list = duty.teachers.filter(t => !t.exclude && t.loc === l);
    const cs = list.map(t => per[key(l, t.name)].wd);
    const slots = cs.reduce((a, b) => a + b, 0);
    locs[l] = {n:list.length, slots, need:need[l], none:none[l], friNeed:friNeed[l], avg: list.length ? slots / list.length : 0,
      min: cs.length ? Math.min(...cs) : 0, max: cs.length ? Math.max(...cs) : 0,
      friMax: list.length ? Math.max(...list.map(t => per[key(l, t.name)].fri)) : 0};
  });
  return {per, locs, key};
}
/*CORE-END*/

/* ---------- 기본 데이터 (관리자 '기본값 불러오기' 및 오프라인 사용 시) ---------- */

  DORM:'강래명*교문지도,김기완*교문지도,이지호,박철규,안정애,김성호^,정혜섭,이태영,정주영,김수연,이경민,김승권,신지현,정광진,방형협,최종문,송제택,이우선,윤혜경,유석만,이승영,임준,백승혁,박정기*교문지도,임태관*교문지도,황현지*교문지도',
  STUDY_12:'조정혜,노정은,이은재,정소은,윤해님,오송이,정은영,김보경,지정민,김가영,배현주,임은실,정혜진,김소연,정다운,박신영,김유미,서승안*교문지도,이미정*교문지도,이재현*교문지도',
  STUDY_3:'박수선,김양현,권희진,박보라,박은혜,장금주,이영민,김성현,김병준,신현준,박지원,홍현선*교문지도,김대현*교문지도'
};
function defaultDuty(){

  LOCS.forEach(loc => DEFAULT_ROSTER[loc].split(',').forEach(raw => {

  const S3 = ['STUDY_12','STUDY_3'], A = ['ALL'];
  const H = [['2026-08-19','개학식',S3],['2026-09-02','전국연합학력평가(1,2) 대수능모의평가(3)',S3],['2026-09-23','추석연휴',A],['2026-09-24','추석연휴',A],['2026-09-25','추석연휴',A],['2026-10-05','대체공휴일',A],
    ['2026-10-07','1차 정기시험',S3],['2026-10-08','1차 정기시험',S3],['2026-10-09','한글날',S3],['2026-10-12','1차 정기시험',S3],['2026-10-13','1차 정기시험',S3],['2026-10-20','전국연합학력평가',S3],
    ['2026-11-18','예비소집일',A],['2026-11-19','대학수학능력시험',A],['2026-11-20','재량휴업일',A],['2026-12-14','2차 정기시험',S3],['2026-12-15','2차 정기시험',S3],['2026-12-16','2차 정기시험',S3],['2026-12-17','2차 정기시험',S3],['2026-12-18','2차 정기시험',A],
    ['2026-12-24','동아리발표',A],['2026-12-25','성탄절',A],['2026-12-31','새벽별축제',A],['2027-01-01','신정',A],['2027-01-08','종업식, 졸업식',A]];
  return {
    settings:{term:'2학기', start:'2026-08-19', end:'2027-01-08', ends:{DORM:'2027-01-08', STUDY_12:'2027-01-08', STUDY_3:'2026-11-17'}, pin:'1954'},
    holidays: H.map(([date, reason, locs]) => ({id:id++, date, reason, locs:[...locs]})),
    teachers, specials:[], schedule:[], meta:{}, nextId: id + 10
  };
}

/* role: null(열람) | 'editor'(수정 권한 교사) | 'admin'(관리자). isAdmin = 수정 가능 여부, isSuper = 관리자(권한 코드 관리) */
let duty = null, study = {}, fdb = null, uid = null, dl = null, backend = 'loading', isAdmin = false, isSuper = false;
let role = null, myCode = '', myName = '', codes = {}, codeWatch = null, allCodesWatch = null, authOk = false;

ui.reportEdit = false;

/* Realtime Database는 빈 배열·빈 객체를 저장하지 않으므로 읽을 때 기본값을 채운다 */
function normalizeDuty(d){
  if (!d) return null;
  const base = defaultDuty();
  d.settings = Object.assign({}, base.settings, d.settings || {});
  d.settings.ends = Object.assign({}, base.settings.ends, (d.settings && d.settings.ends) || {});
  d.holidays = arr(d.holidays).map(h => ({...h, locs: arr(h.locs).length ? arr(h.locs) : ['ALL']}));
  d.teachers = arr(d.teachers).map(t => ({leaveStart:'', leaveEnd:'', exclude:'', prevEnd:false, ...t, offDays: arr(t.offDays)}));
  d.specials = arr(d.specials).map(s => ({assigned:'', note:'', ...s}));
  d.schedule = arr(d.schedule).map(r => ({...r, c: Object.assign({DORM:'X', STUDY_12:'X', STUDY_3:'X'}, r.c || {}), sp: r.sp || {}, m: r.m || {}, note: r.note || ''}));
  d.meta = d.meta || {}; d.nextId = d.nextId || 1000;

/* ---------- 저장 계층 (Firebase Realtime Database) ---------- */
let dutyTimer = null, dutyDirty = false, dutyWriting = false;
function setSync(state, text){
  const el = document.getElementById('syncBadge');
  el.className = 'sync ' + ({saved:'ok', saving:'busy', error:'err'}[state] || '');
  el.textContent = text || ({saved: backend === 'fb' ? '실시간 공유 중' : '이 브라우저에만 저장됨', saving:'저장 중…', error:'저장 실패'}[state] || '');
}
function saveDuty(){

  if (backend !== 'fb'){ lsSet(LS.duty, duty); dutyDirty = false; setSync('saved'); return; }
  setSync('saving'); clearTimeout(dutyTimer); dutyTimer = setTimeout(flushDuty, 500);
}
async function flushDuty(){

  dutyWriting = true;
  try { await fdb.ref('duty').set(clone(duty)); dutyDirty = false; setSync('saved'); }
  catch(e){ dutyDirty = false; dbError(e); }

}
async function saveStudy(ds, rec){
  if (rec) study[ds] = rec; else delete study[ds];
  if (backend !== 'fb'){ lsSet(LS.study, study); setSync('saved'); return true; }
  setSync('saving');
  try { const ref = fdb.ref('study/' + ds); rec ? await ref.set(clone(rec)) : await ref.remove(); setSync('saved'); return true; }
  catch(e){ dbError(e); return false; }
}

  if (c.includes('permission')) toast('수정 권한이 없거나 회수되었습니다. 관리자에게 받은 코드로 다시 로그인하세요.', true);

}

async function initBackend(){
  if (window.firebase && firebase.initializeApp){
    try {
      firebase.initializeApp(firebaseConfig);
      fdb = firebase.database(); backend = 'fb';
    } catch(e){ console.error(e); fdb = null; }
  }
  if (fdb){
    fdb.ref('duty').on('value', s => {
      if (dutyDirty || dutyWriting){ loaded.duty = true; return; }
      duty = s.exists() ? normalizeDuty(s.val()) : null; loaded.duty = true; setSync('saved'); scheduleRender();
    }, err => { console.error(err); loaded.duty = true; setSync('error', '데이터를 읽지 못함 — 보안 규칙 확인'); render(); });
    fdb.ref('study').on('value', s => { study = s.val() || {}; loaded.study = true; scheduleRender(); },
      err => { console.error(err); setSync('error', '참여 기록을 읽지 못함'); });
    fdb.ref('.info/connected').on('value', s => { if (s.val() === false && loaded.duty) setSync('error', '연결 끊김 — 다시 연결 중'); else if (s.val()) setSync('saved'); });
    try {
      const cred = await firebase.auth().signInAnonymously(); uid = cred.user.uid; authOk = true;
      const s = await fdb.ref('sessions/' + uid).get();

    if (!duty.schedule.length){ duty.meta = {seed: 20260819, generatedAt: Date.now(), sig: sigOf(duty)}; duty.schedule = generateSchedule(duty, 'ALL', 20260819); }
    study = lsGet(LS.study) || {}; loaded = {duty:true, study:true};
    setSync('saved', '오프라인 — 이 브라우저에만 저장됨'); render();
  }
}

/* ---------- 권한 코드 ---------- */
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const newCode = () => { let c; do { c = Array.from({length:6}, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join(''); } while (codes[c]); return c; };
const cleanCode = s => String(s || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
function setRole(entry, code){
  role = entry ? entry.role : null; myCode = entry ? code : ''; myName = entry ? (entry.name || '') : '';
  isAdmin = role === 'admin' || role === 'editor'; isSuper = role === 'admin';
  if (allCodesWatch && !isSuper){ allCodesWatch(); allCodesWatch = null; codes = {}; }
  if (isSuper && !allCodesWatch && fdb){
    const ref = fdb.ref('access'), cb = ref.on('value', s => { codes = s.val() || {}; scheduleRender(); }, () => {});
    allCodesWatch = () => ref.off('value', cb);
  }

}
async function attachCode(code, silent){

  await fdb.ref('sessions/' + uid).set({code, at: Date.now()});

function showCode(code, who, r){
  openModal(`<h3>${r === 'admin' ? '관리자' : '수정 권한'} 코드를 만들었습니다</h3>
    <p class="muted" style="margin:0">${esc(who)}께 아래 코드를 전달하세요. 오른쪽 위 <b>코드로 로그인</b>에 입력하면 ${r === 'admin' ? '관리자 권한(권한 코드 관리 포함)' : '학사일정·명단·배정표 수정과 참여 현황 기록'}을 할 수 있습니다.</p>
    <div class="row" style="justify-content:center;gap:12px"><b class="num" id="codeShow" style="font-size:34px;letter-spacing:.18em">${code}</b><button class="btn" id="codeCopy">복사</button></div>
    <p class="tiny muted" style="margin:0">권한은 학사일정 탭의 <b>권한 코드 관리</b>나 교사 명단에서 언제든 회수할 수 있습니다.</p>
    <div class="mf"><button class="btn primary" onclick="closeModal()">확인</button></div>`);
  document.getElementById('codeCopy').onclick = () => { try { navigator.clipboard.writeText(code).then(() => toast('코드를 복사했습니다.'), () => toast('코드를 직접 옮겨 적어 주세요.')); } catch(e){ toast('코드를 직접 옮겨 적어 주세요.'); } };
}
async function revokeCode(code){
  if (!isSuper) return; const c = codes[code]; if (!c) return;
  const admins = Object.values(codes).filter(x => x.role === 'admin').length;
  if (c.role === 'admin' && admins <= 1){ toast('마지막 관리자 코드는 회수할 수 없습니다. 다른 관리자 코드를 먼저 만드세요.', true); return; }
  const self = code === myCode;
  if (!await ask('권한 회수', `${esc(c.name || '')} (${code})의 ${c.role === 'admin' ? '관리자' : '수정'} 권한을 회수합니다. 그 코드로 로그인한 화면은 바로 열람 전용이 됩니다.${self ? '<br><b>지금 쓰고 있는 내 코드입니다.</b>' : ''}`, '회수', true)) return;
  try { await fdb.ref('access/' + code).remove(); toast('권한을 회수했습니다.'); } catch(e){ dbError(e); }
}
function codeOfTeacher(t){ return Object.keys(codes).find(k => codes[k].role === 'editor' && (codes[k].teacherId === t.id || (codes[k].name === t.name && codes[k].loc === t.loc))); }
function codesPanelHTML(){
  if (backend !== 'fb') return '';
  if (!isSuper) return `<section class="panel"><div class="ph"><h2>권한 코드</h2></div><p class="muted small" style="margin:0">${role === 'editor' ? `<b>${esc(myName)}</b> 선생님의 수정 권한으로 로그인했습니다. 권한 코드 관리는 관리자만 할 수 있습니다.` : '수정 권한 코드는 관리자가 교사 명단에서 선생님별로 발급합니다.'}</p></section>`;
  const list = Object.entries(codes).sort((a, b) => (a[1].role === 'admin' ? 0 : 1) - (b[1].role === 'admin' ? 0 : 1) || String(a[1].name).localeCompare(String(b[1].name), 'ko'));
  return `<section class="panel"><div class="ph"><h2>권한 코드 관리 (${list.length}개)</h2></div>
    <div class="tw" style="max-height:300px;overflow:auto"><table><thead><tr><th>코드</th><th class="l">이름</th><th>권한</th><th>발급일</th><th>관리</th></tr></thead><tbody>
    ${list.map(([k, c]) => `<tr><td class="n"><b>${k}</b>${k === myCode ? ' <span class="tag t-ok">나</span>' : ''}</td><td class="l">${esc(c.name || '')}${c.loc ? ` <span class="tiny muted">${LOC_SHORT[c.loc] || ''}</span>` : ''}</td><td>${c.role === 'admin' ? '<span class="tag t-warn">관리자</span>' : '<span class="tag t-ok">수정</span>'}</td><td class="n small">${c.createdAt ? new Date(c.createdAt).toLocaleDateString('ko-KR') : ''}</td><td><button class="btn sm danger" onclick="revokeCode('${k}')">회수</button></td></tr>`).join('')}</tbody></table></div>
    <div class="form-line" style="margin-top:10px"><label class="field"><span>관리자 코드 추가 (공동 관리자)</span><input type="text" id="admName" placeholder="예: 교무부장"></label><button class="btn" onclick="addAdminCode()">관리자 코드 만들기</button></div>
    <p class="tiny muted" style="margin:6px 0 0">선생님별 수정 권한 코드는 <b>교사 명단</b> 표의 '수정 권한' 칸에서 발급합니다. 회수하면 그 코드로 로그인한 화면이 즉시 열람 전용으로 바뀝니다.</p></section>`;
}

let renderPending = false;
function scheduleRender(){
  const a = document.activeElement;
  if (document.getElementById('ov')) { renderPending = true; return; }
  if (a && a.closest && a.closest('#view') && /INPUT|SELECT|TEXTAREA/.test(a.tagName)){
    if (!renderPending){ renderPending = true; a.addEventListener('blur', () => { renderPending = false; setTimeout(render, 0); }, {once:true}); }
    return;
  }
  renderPending = false; render();
}

/* ---------- 공용 UI ---------- */
function toast(msg, err){
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.getElementById('toastRoot').appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3200);
}
function openModal(html, wide){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="ov" id="ov"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  document.getElementById('ov').addEventListener('mousedown', e => { if (e.target.id === 'ov') closeModal(); });
  const f = root.querySelector('input:not([disabled]),select:not([disabled]),textarea,button.primary'); if (f) setTimeout(() => f.focus(), 30);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; if (renderPending){ renderPending = false; render(); } }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('ov')) closeModal(); });
function ask(title, body, okLabel = '확인', danger = false){
  return new Promise(res => {
    openModal(`<h3>${esc(title)}</h3><div class="muted">${body}</div><div class="mf"><button class="btn" id="askNo">취소</button><button class="btn ${danger ? 'danger solid' : 'primary'}" id="askYes">${esc(okLabel)}</button></div>`);
    document.getElementById('askNo').onclick = () => { closeModal(); res(false); };
    document.getElementById('askYes').onclick = () => { closeModal(); res(true); };
  });
}
function needAdmin(){ if (!isAdmin){ toast('수정 권한이 필요합니다. 관리자에게 받은 코드로 로그인하세요.', true); return false; } return true; }

async function saveFile(filename, data, type){
  const blob = data instanceof Blob ? data : new Blob([data], {type});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function saveXlsx(filename, sheets){
  if (typeof XLSX === 'undefined'){ toast('엑셀 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하세요.', true); return; }
  const wb = XLSX.utils.book_new();
  sheets.forEach(([name, rows, widths]) => { const ws = XLSX.utils.aoa_to_sheet(rows); if (widths) ws['!cols'] = widths.map(w => ({wch:w})); XLSX.utils.book_append_sheet(wb, ws, name); });
  XLSX.writeFile(wb, filename);
}

/* ---------- 로그인 ---------- */

  if (role || (backend === 'local' && isAdmin)){ if (backend === 'fb') logout(); else { isAdmin = isSuper = false; updateMode(); render(); } return; }

  openModal(`<h3>코드로 로그인</h3><p class="muted small" style="margin:0">관리자에게 받은 <b>수정 권한 코드</b> 또는 <b>관리자 코드</b>를 입력하세요. 코드 없이도 모든 화면을 열람할 수 있습니다.</p>
    <label class="field"><span>코드</span><input type="text" id="pinIn" maxlength="24" autocomplete="off" autocapitalize="characters" style="font-family:var(--f-mono);font-size:20px;letter-spacing:.12em;text-transform:uppercase"></label>
    <p id="pinErr" class="small" style="margin:0;color:var(--bad)" hidden>등록되지 않았거나 회수된 코드입니다.</p>
    <div class="mf"><button class="btn" onclick="closeModal()">취소</button><button class="btn primary" id="pinOk">로그인</button></div>`);
  const goIn = async () => {
    const code = cleanCode(document.getElementById('pinIn').value); if (!code) return;
    if (backend !== 'fb'){ if (code === cleanCode((duty && duty.settings.pin) || '1954')){ isAdmin = isSuper = true; closeModal(); updateMode(); render(); } else document.getElementById('pinErr').hidden = false; return; }
    try { if (await attachCode(code, false)){ closeModal(); toast('로그인했습니다.'); } else document.getElementById('pinErr').hidden = false; }

function updateMode(){
  const b = document.getElementById('modeBadge');
  b.className = 'mode' + (isAdmin ? ' admin' : '');
  b.textContent = isSuper ? `관리자${myName ? ' · ' + myName : ''}` : isAdmin ? `수정 권한 · ${myName}` : '열람 전용';

/* ---------- 탭 ---------- */
const TABS = ['home','calendar','report','duty','fairness'];
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) go(b.dataset.tab); });
function go(tab){ ui.tab = tab; saveUi(); try { history.replaceState(null, '', '#' + tab); } catch(e){} render(); window.scrollTo(0, 0); }
if (TABS.includes(location.hash.slice(1))) ui.tab = location.hash.slice(1);

function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === ui.tab ? 'page' : 'false'));
  const v = document.getElementById('view');
  if (!loaded.duty){ return; }
  if (duty){ const ymd = s => s.slice(2).replace(/-/g, '.'); document.getElementById('termLabel').textContent = `[${duty.settings.term || '학기'}] ${ymd(duty.settings.start)}~${ymd(duty.settings.end)}`; }
  if (!duty){ v.innerHTML = emptyDutyHTML(); return; }
  const fn = {home:renderHome, calendar:renderCalendar, report:renderReport, duty:renderDuty, fairness:renderFairness}[ui.tab] || renderHome;
  v.innerHTML = fn();
  afterRender();
}

  if (isSuper || (backend === 'local' && isAdmin)) return `<div class="panel empty"><h3>학사일정과 교사 명단을 불러오세요</h3>

  return `<div class="panel empty" style="max-width:640px;margin:0 auto"><h3>처음 설정 — 관리자 코드 만들기</h3>

    <div class="row" style="justify-content:center;margin-top:12px;flex-wrap:nowrap;max-width:420px;margin-inline:auto"><input type="text" id="firstCode" placeholder="예: HSADMIN2026" style="font-family:var(--f-mono);text-transform:uppercase"><button class="btn primary" onclick="createFirstAdmin()">만들기</button></div></div>`;

async function createFirstAdmin(){
  const code = cleanCode(document.getElementById('firstCode').value);
  if (code.length < 6){ toast('영문·숫자 6자 이상으로 정하세요.', true); return; }
  if (!authOk){ toast('Firebase 익명 로그인이 꺼져 있습니다. 설정 안내를 확인하세요.', true); return; }
  try { await fdb.ref('access/' + code).set({role:'admin', name:'관리자', createdAt: Date.now(), by:'처음 설정'}); }
  catch(e){
    console.error(e);
    const denied = String((e && (e.code || e.message)) || '').toLowerCase().includes('permission');
    let exists = false; try { exists = (await fdb.ref('access/' + code).get()).exists(); } catch(_){}
    if (exists) toast('이미 같은 코드가 있습니다. 오른쪽 위 코드로 로그인에 이 코드를 입력하세요.', true);
    else if (denied) toast('Firebase가 저장을 거부했습니다. ① Realtime Database → 규칙에 최신 보안 규칙 파일을 붙여 넣고 게시했는지, ② 이미 다른 관리자 코드가 있는지 확인하세요.', true);
    else toast('저장하지 못했습니다: ' + ((e && e.message) || '알 수 없는 오류'), true);
    return;
  }
  try { await attachCode(code, false); } catch(e){ console.error(e); toast('코드는 만들었지만 로그인하지 못했습니다. 보안 규칙을 확인한 뒤 코드로 로그인을 눌러 주세요.', true); return; }
  toast(`관리자 코드 ${code}를 만들었습니다. 잊지 않게 적어 두세요.`); render();
}
async function loadDefaults(){
  if (!needAdmin()) return;
  duty = defaultDuty(); duty.meta = {seed: 20260819, generatedAt: Date.now(), sig: sigOf(duty)};
  duty.schedule = generateSchedule(duty, 'ALL', 20260819); saveDuty(); render(); toast('기본 명단과 학기 일정을 불러오고 배정을 완료했습니다.');
}
let afterRender = () => {};

/* ---------- 공용 계산 ---------- */
const schedMap = () => { const m = {}; duty.schedule.forEach(r => m[r.date] = r); return m; };
function closedAll(ds){ return holidaysOn(duty, ds).some(h => h.locs.includes('ALL')); }
function recTotals(r){
  if (!r || r.reason) return null;
  const g = k => r[k] || {};
  const a1 = +g('g1').apply || 0, t1 = +g('g1').attend || 0, a2 = +g('g2').apply || 0, t2 = +g('g2').attend || 0;
  const a3 = +g('g3').apply || 0, t3 = +g('g3').attend || 0;
  return {a1, t1, a2, t2, a3, t3, A: a1 + a2 + a3, T: t1 + t2 + t3};
}
const pct = (t, a) => a ? (t / a * 100).toFixed(1) + '%' : '–';
function weekLabel(mon){
  const thu = pd(addD(mon, 3));
  return `${thu.getMonth()+1}월 ${Math.floor((thu.getDate()-1)/7)+1}주차`;
}
function cellText(v, loc, r){
  if (v === 'X') return '<span class="cell-x">–</span>';
  if (v === '!') return '<span class="cell-none">가능 교사 없음</span>';
  if (!v) return '<span class="cell-x">미지정</span>';
  return esc(v) + (r && r.m && r.m[loc] ? '<span class="manual" title="직접 지정한 배정">지정</span>' : '');
}

/* ---------- 주간 표 ---------- */
function weekTotals(mon){
  let A=0, T=0, filled=0, open=0;
  for (let i = 0; i < 5; i++){ const ds = addD(mon, i); const rec = study[ds]; if (closedAll(ds) || (rec && rec.reason)) continue; open++; const t = recTotals(rec); if (t){ filled++; A += t.A; T += t.T; } }

function weekChartSVG(mon, h = 220){

  const days = [0,1,2,3,4].map(i => { const ds = addD(mon, i); return {ds, t: recTotals(study[ds])}; });

  const nice = Math.ceil(mx / 10) * 10, y = v => padT + (H - padT - padB) * (1 - v / nice);
  const gw = (W - padL) / 5, bw = Math.min(26, gw / 4.2);
  let g = '<g class="grid">'; for (let k = 0; k <= 4; k++){ const v = nice * k / 4; g += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`; } g += '</g>';

  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="요일별 학년 신청(막대)·참여(꺾은선) 인원">${g}${bars}${lines}</svg>

    days.push({ds, duty: duty_, t, reason});
    if (t){ open++; A[0]+=t.a1; A[1]+=t.a2; A[2]+=t.a3; T[0]+=t.t1; T[1]+=t.t2; T[2]+=t.t3;

function studyRows(start, end){
  const rows = [['날짜','요일','학년','신청인원','참여인원','참여율','특이사항']];
  Object.keys(study).sort().forEach(ds => {
    if (ds < start || ds > end) return; const d = study[ds], w = DOW[dowOf(ds)];
    if (d.reason){ rows.push([ds, w, '전체', '-', '-', '-', d.reason]); return; }
    const g3 = d.g3 || {}, r = (a, t) => a ? +(t / a * 100).toFixed(1) : '';
    rows.push([ds, w, '1학년', +d.g1?.apply||0, +d.g1?.attend||0, r(+d.g1?.apply, +d.g1?.attend), '']);
    rows.push([ds, w, '2학년', +d.g2?.apply||0, +d.g2?.attend||0, r(+d.g2?.apply, +d.g2?.attend), '']);
    if (g3.m_apply !== undefined){ rows.push([ds, w, '3학년(남)', +g3.m_apply||0, +g3.m_attend||0, r(+g3.m_apply, +g3.m_attend), '']); rows.push([ds, w, '3학년(여)', +g3.f_apply||0, +g3.f_attend||0, r(+g3.f_apply, +g3.f_attend), '']); }
    rows.push([ds, w, '3학년(합계)', +g3.apply||0, +g3.attend||0, r(+g3.apply, +g3.attend), '']);
  });
  return rows;
}

function addSpecial(){
  if (!needAdmin()) return;
  const s = document.getElementById('adS').value, e = document.getElementById('adE').value || s, weOnly = document.getElementById('adWe').checked;
  const locs = [...document.querySelectorAll('.adLoc:checked')].map(c => c.value), note = document.getElementById('adNote').value.trim() || '주말·특별 근무';
  if (!s || e < s){ toast('날짜를 올바르게 선택하세요.', true); return; }
  if (!locs.length){ toast('근무 장소를 하나 이상 고르세요.', true); return; }
  let n = 0, skip = 0;
  for (let d = s; d <= e; d = addD(d, 1)){
    const w = dowOf(d); if (s !== e && weOnly && w !== 0 && w !== 6) continue;
    locs.forEach(loc => { if (duty.specials.some(x => x.date === d && x.loc === loc)){ skip++; return; } const sp = {date:d, loc, note, assigned:''}; duty.specials.push(sp); insertSpecialRow(sp); n++; });
  }
  if (!n){ toast(skip ? '이미 등록된 근무일입니다.' : '추가할 날짜가 없습니다. 기간과 토·일 옵션을 확인하세요.', true); return; }
  closeModal(); saveDuty(); render(); toast(`특별 근무 ${n}건을 추가했습니다.${skip ? ` (이미 있던 ${skip}건 제외)` : ''}`);

function setDate(id, v){

function changePin(){ if (!needAdmin()) return; const p = document.getElementById('newPin').value.trim(); if (!/^\d{4,8}$/.test(p)){ toast('숫자 4~8자리로 입력하세요.', true); return; } duty.settings.pin = p; saveDuty(); toast('관리자 번호를 바꿨습니다.'); render(); }
function addHoliday(kind){
  if (!needAdmin()) return; let n = 0;
  const push = (date, reason, locs) => { duty.holidays.push({id: duty.nextId++, date, reason: reason || '휴업일', locs}); n++; };
  if (kind === 'single'){ const d = document.getElementById('hSingle').value; if (!d){ toast('날짜를 선택하세요.', true); return; } push(d, document.getElementById('hSingleNote').value.trim(), getLocs('locSingle')); }
  if (kind === 'range'){
    const s = document.getElementById('hRangeS').value, e = document.getElementById('hRangeE').value;
    if (!s || !e || s > e){ toast('시작일과 끝을 올바르게 선택하세요.', true); return; }
    const locs = getLocs('locRange'), note = document.getElementById('hRangeNote').value.trim();
    for (let d = s; d <= e; d = addD(d, 1)){ const w = dowOf(d); if (w !== 0 && w !== 6) push(d, note, locs); }
  }
  if (kind === 'bulk'){
    document.getElementById('hBulk').value.split('\n').forEach(line => {
      const m = line.trim().match(/^(\d{4}-\d{2}-\d{2})\s*:?\s*(.*)$/); if (!m) return;
      let rest = m[2].trim(), locs = ['ALL'];
      const lm = rest.match(/^\[(.*?)\]/);
      if (lm){ const t = lm[1]; locs = t.includes('기숙사') ? ['DORM'] : (t.includes('1,2') || t.includes('1·2') || t.includes('여학생')) ? ['STUDY_12'] : t.includes('3학년') ? ['STUDY_3'] : ['ALL']; rest = rest.replace(/^\[.*?\]/, '').trim(); }
      push(m[1], rest, locs);
    });
  }
  if (!n){ toast('추가할 날짜를 찾지 못했습니다. 형식: 2026-12-03: 사유', true); return; }
  saveDuty(); render(); toast(`제외일 ${n}건을 추가했습니다.`);
}

async function delHolidayRange(){ if (!needAdmin()) return; const s = document.getElementById('hdS').value, e = document.getElementById('hdE').value; if (!s || !e){ toast('삭제할 기간을 선택하세요.', true); return; } const n = duty.holidays.filter(h => h.date >= s && h.date <= e).length; if (await ask('기간 내 삭제', `${s} ~ ${e} 제외일 ${n}건을 지웁니다.`, '삭제', true)){ duty.holidays = duty.holidays.filter(h => h.date < s || h.date > e); saveDuty(); render(); } }
async function delHolidayAll(){ if (!needAdmin()) return; if (await ask('전체 비우기', `등록된 제외일 ${duty.holidays.length}건을 모두 지웁니다.`, '모두 삭제', true)){ duty.holidays = []; saveDuty(); render(); } }

const EXC = {'':'근무 가능','교문지도':'제외 · 교문지도','급식':'제외 · 급식'};

  let prevLoc = '';

    prevLoc = t.loc;
    return head + `<tr><td><select onchange="tSet(${t.id},'loc',this.value)" ${dis()}>${LOCS.map(l => `<option value="${l}" ${t.loc === l ? 'selected' : ''}>${LOC_NAME[l]}</option>`).join('')}</select></td>
      <td><b>${esc(t.name)}</b></td><td style="min-width:150px">${excSel(t)}</td>
      <td><input type="checkbox" ${t.prevEnd ? 'checked' : ''} onchange="tSet(${t.id},'prevEnd',this.checked)" aria-label="지난 학기 말 근무" ${dis()}></td>
      <td><div class="row" style="justify-content:center;gap:4px;flex-wrap:nowrap">${['월','화','수','목','금'].map(d => `<label class="chk"><input type="checkbox" ${t.offDays.includes(d) ? 'checked' : ''} onchange="tDay(${t.id},'${d}',this.checked)" ${dis()}>${d}</label>`).join('')}</div></td>
      <td><div class="row" style="flex-wrap:nowrap;gap:4px"><input type="date" value="${t.leaveStart}" onchange="tSet(${t.id},'leaveStart',this.value)" ${dis()}>~<input type="date" value="${t.leaveEnd}" onchange="tSet(${t.id},'leaveEnd',this.value)" ${dis()}></div></td>
      ${isSuper ? `<td>${(c => c ? `<div class="row" style="justify-content:center;gap:4px;flex-wrap:nowrap"><span class="tag t-ok num">${c}</span><button class="btn sm danger" onclick="revokeCode('${c}')">회수</button></div>` : `<button class="btn sm" onclick="grantCode(${t.id})">코드 부여</button>`)(codeOfTeacher(t))}</td>` : ''}
      <td><button class="btn sm danger" onclick="tDel(${t.id})" ${dis()}>삭제</button></td></tr>`;
  }).join('');
  const missing = rosterMissing();
  const upd = missing.length && isAdmin ? `<div class="note info"><p><b>새 명단에 있는 교사 ${missing.length}명이 아직 등록되지 않았습니다:</b> ${missing.map(m => `${esc(m.name)}(${LOC_SHORT[m.loc]})`).join(', ')}</p><p>근무 상태는 <b>제외 · 교문지도</b>로 들어가므로 기존 배정표와 횟수는 바뀌지 않습니다. <button class="btn sm primary" onclick="applyRoster()">${missing.length}명 추가</button></p></div>` : '';
  return `${upd}<section class="panel"><div class="ph"><h2>교사 추가</h2></div>
      <div class="t-add">
        <div class="field"><span>배정 장소</span><select id="ntLoc" ${dis()}>${LOCS.map(l => `<option value="${l}">${LOC_NAME[l]}</option>`).join('')}</select></div>
        <div class="field"><span>이름</span><input type="text" id="ntName" placeholder="예: 홍길동" ${dis()}></div>
        <div class="field"><span>근무 상태</span><select id="ntExc" ${dis()}>${Object.entries(EXC).map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}<option value="__custom">제외 · 직접 입력</option></select></div>
        <div class="field"><span>직접 입력 사유</span><input type="text" id="ntExcTxt" placeholder="직접 입력일 때" ${dis()}></div>
        <div class="field"><span>지난 학기 말 근무</span><label class="chk"><input type="checkbox" id="ntPrev" ${dis()}> 근무함</label></div>
        <div class="field"><span>근무 불가 요일</span><div class="days">${['월','화','수','목','금'].map(d => `<label class="chk"><input type="checkbox" class="ntDay" value="${d}" ${dis()}>${d}</label>`).join('')}</div></div>
        <div class="field"><span>근무 불가 기간 (병가·경조사)</span><div class="range"><input type="date" id="ntLS" ${dis()}><span>~</span><input type="date" id="ntLE" ${dis()}></div></div>
        <div class="field"><span>&nbsp;</span><button class="btn primary" onclick="tAdd()" ${dis()}>추가</button></div>
      </div></section>
    <section class="panel"><div class="ph"><h2>전체 교사 명단</h2><span class="muted small">장소별 가나다순 · 표에서 바로 수정됩니다</span></div>
      <div class="tw tall"><table><thead><tr><th>배정 장소</th><th>이름</th><th>근무 상태</th><th>지난 학기 말 근무</th><th>근무 불가 요일</th><th>근무 불가 기간</th>${isSuper ? '<th>수정 권한</th>' : ''}<th>관리</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="tiny muted" style="margin:8px 0 0">'지난 학기 말 근무'를 체크한 선생님은 학기 초 배정에서 뒤로 밀립니다. 조건을 바꾼 뒤에는 배정표 탭에서 다시 배정해야 반영됩니다.</p></section>`;
}
function rosterMissing(){
  const d = defaultDuty().teachers;
  return d.filter(x => !duty.teachers.some(t => t.name === x.name));
}
function applyRoster(){
  if (!needAdmin()) return;
  const m = rosterMissing();
  m.forEach(x => duty.teachers.push({...x, id: duty.nextId++}));
  saveDuty(); render(); toast(`${m.length}명을 명단에 추가했습니다. (제외 · 교문지도)`);
}
function tFind(id){ return duty.teachers.find(t => t.id === id); }
function tSet(id, k, v){ if (!needAdmin()) return; const t = tFind(id); if (!t) return; t[k] = v; saveDuty(); if (k === 'loc' || k === 'exclude') render(); }
function tExc(id, v){ if (!needAdmin()) return; const t = tFind(id); if (!t) return; t.exclude = v === '__custom' ? (t.exclude && !(t.exclude in EXC) ? t.exclude : '기타') : v; saveDuty(); render(); }
function tDay(id, d, on){ if (!needAdmin()) return; const t = tFind(id); if (!t) return; t.offDays = t.offDays.filter(x => x !== d); if (on) t.offDays.push(d); saveDuty(); }
async function tDel(id){ if (!needAdmin()) return; const t = tFind(id); if (t && await ask('교사 삭제', `${esc(t.name)} 선생님을 명단에서 지웁니다. 이미 만들어진 배정표의 이름은 그대로 남습니다.`, '삭제', true)){ duty.teachers = duty.teachers.filter(x => x.id !== id); saveDuty(); render(); } }
function tAdd(){
  if (!needAdmin()) return;
  const name = document.getElementById('ntName').value.trim(); if (!name){ toast('이름을 입력하세요.', true); return; }
  const loc = document.getElementById('ntLoc').value;
  if (duty.teachers.some(t => t.name === name && t.loc === loc)){ toast('같은 장소에 같은 이름이 이미 있습니다.', true); return; }
  const ev = document.getElementById('ntExc').value;
  duty.teachers.push({id: duty.nextId++, name, loc, exclude: ev === '__custom' ? (document.getElementById('ntExcTxt').value.trim() || '기타') : ev,
    offDays: [...document.querySelectorAll('.ntDay:checked')].map(c => c.value), prevEnd: document.getElementById('ntPrev').checked,
    leaveStart: document.getElementById('ntLS').value, leaveEnd: document.getElementById('ntLE').value});
  saveDuty(); render(); toast(`${name} 선생님을 추가했습니다.`);
}

/* ---------- 5. 공정성 검증 ---------- */
function recommendNote(S){
  const arr = LOCS.map(l => ({l, ...S.locs[l]})).filter(x => x.n > 0).sort((a, b) => b.avg - a.avg);
  if (arr.length < 2 || !duty.schedule.length) return '';
  const hi = arr[0], lo = arr[arr.length - 1], diff = hi.avg - lo.avg;
  if (diff < 0.5) return `<div class="note ok"><p><b>장소 간 1인당 평균 감독 횟수가 고르게 맞춰져 있습니다.</b> 가장 많은 곳과 적은 곳의 차이 ${diff.toFixed(2)}회.</p></div>`;
  let move = Math.round((hi.slots * lo.n - lo.slots * hi.n) / (hi.slots + lo.slots)); if (move < 1) move = 1;
  return `<div class="note"><p><b>장소 간 1인당 평균 감독 횟수 차이 ${diff.toFixed(2)}회</b> — ${LOC_NAME[hi.l]} ${hi.avg.toFixed(2)}회, ${LOC_NAME[lo.l]} ${lo.avg.toFixed(2)}회.</p>
    <p>부담을 비슷하게 맞추려면 ${LOC_NAME[lo.l]}에서 ${LOC_NAME[hi.l]}(으)로 <b>${move}명</b>을 옮겨 배치하는 것을 검토하세요. (장소 이동은 교사 명단에서 바꾼 뒤 다시 배정)</p></div>`;
}
function locSummaryTable(S){
  return `<div class="tw"><table><thead><tr><th class="l">장소</th><th>운영 종료일</th><th>운영일(필요 감독 수)</th><th>배정 감독 수</th><th>1인당 평균</th><th>최소 ~ 최대</th><th>최대 편차</th><th>금요일 최다</th><th>미배정</th></tr></thead><tbody>${LOCS.map(l => { const L = S.locs[l]; const sp = L.max - L.min;
    return `<tr><td class="l"><span class="loc ${l}">${LOC_NAME[l]}</span></td><td class="n">${duty.settings.ends[l]}</td><td class="n">${L.need}일</td><td class="n">${L.n}명</td><td class="n"><b>${L.avg.toFixed(2)}회</b></td><td class="n">${L.min} ~ ${L.max}회</td><td>${L.n ? `<span class="tag ${sp <= 1 ? 't-ok' : sp <= 2 ? 't-warn' : 't-bad'}">${sp}회</span>` : '–'}</td><td><span class="tag ${L.friMax <= 1 ? 't-ok' : L.friNeed > L.n ? 't-warn' : 't-bad'}">${L.friMax}회</span> <span class="tiny muted">금 ${L.friNeed}일/${L.n}명</span></td><td>${L.none ? `<span class="tag t-bad">${L.none}일</span>` : '<span class="tag t-ok">없음</span>'}</td></tr>`; }).join('')}</tbody></table></div>`;
}
function verdict(t, p, L){
  if (t.exclude) return {cls:'t-mute', text:`근무 제외 (${t.exclude})`, why:''};
  const lo = Math.floor(L.avg + 1e-9), hi = Math.ceil(L.avg - 1e-9), why = [];
  const cons = []; if (t.offDays.length) cons.push(`불가 요일 ${t.offDays.join('·')}`); if (t.leaveStart && t.leaveEnd) cons.push('불가 기간'); if (t.prevEnd) cons.push('지난 학기 말 근무'); if (p.manual) cons.push(`직접 지정 ${p.manual}칸`);
  if (p.wd < lo) why.push(`평균보다 ${(L.avg - p.wd).toFixed(1)}회 적음`);
  if (p.wd > hi) why.push(`평균보다 ${(p.wd - L.avg).toFixed(1)}회 많음`);
  const friOver = L.friNeed > L.n;
  if (p.fri >= 2) why.push(`금요일 ${p.fri}회`);
  if (!why.length) return {cls:'t-ok', text: '균등 · 금요일 1회 이하', why:''};
  const reason = cons.length ? cons.join(', ') : '';
  const friWhy = p.fri >= 2 && friOver ? `운영 금요일 ${L.friNeed}일 > 배정 인원 ${L.n}명이라 ${L.friNeed - L.n}명은 2회째가 불가피` : '';
  return {cls: p.fri >= 2 && !friOver ? 't-bad' : 't-warn', text: why.join(', '), why: '사유: ' + ([friWhy, reason].filter(Boolean).join(' · ') || '같은 장소 인원 대비 운영일 수 차이')};
}
function fairnessAoa(){
  const S = computeStats(duty); const rows = [['장소','이름','평일 횟수','장소 평균','금요일','주말·특별','직접 지정','설정된 조건','판정','근무 일자']];
  duty.teachers.slice().sort((a, b) => LOCS.indexOf(a.loc) - LOCS.indexOf(b.loc) || a.name.localeCompare(b.name, 'ko')).forEach(t => {
    const p = S.per[S.key(t.loc, t.name)], L = S.locs[t.loc], v = verdict(t, p, L);
    const cons = [t.offDays.length ? '요일:' + t.offDays.join(',') : '', t.leaveStart && t.leaveEnd ? `기간:${t.leaveStart}~${t.leaveEnd}` : '', t.prevEnd ? '직전학기말근무' : ''].filter(Boolean).join(' | ');
    rows.push([LOC_NAME[t.loc], t.name, t.exclude ? '-' : p.wd, +L.avg.toFixed(2), t.exclude ? '-' : p.fri, p.we, p.manual, cons || '없음', v.text + (v.why ? ' / ' + v.why : ''), p.dates.map(md).join(', ')]);
  });
  return rows;
}
function exportFairness(){
  const S = computeStats(duty);
  const sum = [['자기주도학습 감독 배정 공정성 검증표'], [`학기 ${duty.settings.start} ~ ${duty.settings.end} · 배정 번호 ${duty.meta.seed || '-'} · 배정 ${duty.meta.generatedAt ? new Date(duty.meta.generatedAt).toLocaleString('ko-KR') : '-'}`], [],
    ['장소','운영 종료일','운영일','배정 감독 수','1인당 평균','최소','최대','최대 편차','금요일 최다','미배정일'],
    ...LOCS.map(l => { const L = S.locs[l]; return [LOC_NAME[l], duty.settings.ends[l], L.need, L.n, +L.avg.toFixed(2), L.min, L.max, L.max - L.min, L.friMax, L.none]; }), [],
    ['배정 원칙'], ...RULES.map((r, i) => [`${i+1}. ${r}`])];
  saveXlsx('자기주도학습_공정성검증표.xlsx', [['요약', sum, [22,12,8,9,10,6,6,9,10,8]], ['교사별', fairnessAoa(), [20,10,9,9,7,9,9,30,40,80]]]);
}
const RULES = [
  '교사는 자신이 속한 장소의 명단 안에서만 배정합니다. 근무 제외(교문지도·급식 등) 교사는 빠집니다.',
  '근무 불가 요일과 불가 기간(병가·경조사)에 해당하는 교사는 그날 후보에서 뺍니다.',
  '금요일 근무는 1인당 최대 1회입니다. 금요일에는 아직 금요일 근무가 없는 교사만 후보가 되고, 운영 금요일 수가 배정 인원보다 많은 장소에서만 2회째가 생기며 그 경우도 누적 횟수가 가장 적은 교사에게 돌아갑니다.',
  '그다음 학기 누적 평일 근무 횟수가 가장 적은 교사를 고릅니다.',
  '횟수가 같으면 마지막 근무일이 가장 오래된 교사를 고르고, 지난 학기 말에 근무한 교사는 학기 초에 뒤로 밉니다.',
  '그래도 같으면 무작위로 정하되, 배정 번호(시드)가 같으면 언제 다시 실행해도 같은 결과가 나옵니다.',
  '휴업일·장소별 운영 종료일 이후와 주말은 배정하지 않습니다. 주말·특별 근무는 신청자를 지정하며 평일 횟수와 따로 셉니다.'
];
function renderFairness(){
  const S = computeStats(duty);
  const f = ui.fairLoc;
  const list = duty.teachers.filter(t => f === 'ALL' || t.loc === f).slice().sort((a, b) => LOCS.indexOf(a.loc) - LOCS.indexOf(b.loc) || a.name.localeCompare(b.name, 'ko'));
  const maxWd = Math.max(1, ...duty.teachers.map(t => S.per[S.key(t.loc, t.name)].wd));
  const hasWe = duty.specials.length > 0;
  const rows = list.map(t => {
    const p = S.per[S.key(t.loc, t.name)], L = S.locs[t.loc], v = verdict(t, p, L);
    const cons = [t.offDays.length ? `요일 ${t.offDays.join('·')}` : '', t.leaveStart && t.leaveEnd ? `${md(t.leaveStart)}~${md(t.leaveEnd)}` : '', t.prevEnd ? '지난 학기 말 근무' : ''].filter(Boolean).join(' · ');
    return `<tr><td class="l"><span class="loc ${t.loc}">${LOC_SHORT[t.loc]}</span></td><td class="l"><b>${esc(t.name)}</b></td>
      <td class="n">${t.exclude ? '–' : `<b>${p.wd}</b>회`}</td>
      <td style="min-width:150px">${t.exclude ? '' : `<div class="bar" title="평균 ${L.avg.toFixed(2)}회"><i style="width:${p.wd / maxWd * 100}%"></i><b style="left:${L.avg / maxWd * 100}%"></b></div>`}</td>
      <td class="n">${t.exclude ? '–' : p.fri + '회'}</td>${hasWe ? `<td class="n">${p.we}회</td>` : ''}
      <td class="small">${cons || '<span class="muted">없음</span>'}</td>
      <td class="l"><span class="tag ${v.cls}">${esc(v.text)}</span>${v.why ? `<div class="tiny muted" style="margin-top:3px">${esc(v.why)}</div>` : ''}</td>
      <td><div class="datelist">${p.dates.map(d => `<span style="${dowOf(d)===5?'color:var(--warn);font-weight:600':''}">${md(d)}</span>`).join(' ')}</div></td></tr>`;
  }).join('');
  const segBtn = (k, l) => `<button type="button" aria-pressed="${f === k}" onclick="ui.fairLoc='${k}';saveUi();render()">${l}</button>`;
  return `<div class="stack">
    <div class="grid g-2">
      <section class="panel"><div class="ph"><h2>배정 원칙</h2><span class="tag t-mute">배정 번호 <span class="num">${duty.meta.seed || '–'}</span></span></div>
        <ol class="rules">${RULES.map(r => `<li>${r}</li>`).join('')}</ol>
        <p class="tiny muted" style="margin:10px 0 0">${duty.meta.generatedAt ? `마지막 배정: ${new Date(duty.meta.generatedAt).toLocaleString('ko-KR')}` : ''}</p></section>
      <section class="panel"><div class="ph"><h2>검증 요약</h2><span class="spacer"></span><button class="btn sm" onclick="exportFairness()">Excel로 내보내기</button></div>
        ${recommendNote(S) || ''}
        <div style="margin-top:12px">${locSummaryTable(S)}</div>
        <p class="tiny muted" style="margin:8px 0 0">최대 편차 = 같은 장소에서 가장 많이 한 교사와 가장 적게 한 교사의 평일 횟수 차이. 1회 이하면 운영일을 인원으로 나눌 때 생기는 나머지 수준입니다.</p></section>
    </div>
    <section class="panel"><div class="ph"><h2>교사별 근무 횟수와 판정</h2><span class="spacer"></span><div class="seg">${segBtn('ALL','전체')}${LOCS.map(l => segBtn(l, LOC_SHORT[l])).join('')}</div></div>
      <div class="tw tall"><table><thead><tr><th class="l">장소</th><th class="l">이름</th><th>평일</th><th>평균 대비 <span class="tiny muted">(세로선 = 장소 평균)</span></th><th>금요일</th>${hasWe ? '<th>주말·특별</th>' : ''}<th>설정된 조건</th><th class="l">판정</th><th class="l">근무 일자 <span class="tiny" style="color:var(--warn)">주황 = 금요일</span></th></tr></thead><tbody>${rows}</tbody></table></div></section>
